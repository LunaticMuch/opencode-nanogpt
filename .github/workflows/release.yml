name: Release binaries

on:
  push:
    tags: ["v*"]
  create:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example: v1.2.3)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            if [[ -z "$TAG" ]]; then
              echo "Manual dispatch requires a tag input"
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/opencode-nanogpt"
          ASSET="opencode-nanogpt-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$ASSET" -C "$(dirname "$BIN")" opencode-nanogpt
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'create' || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: false

  update-homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'create' || github.event.inputs.tag != ''
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            if [[ -z "$TAG" ]]; then
              echo "Manual dispatch requires a tag input"
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: LunaticMuch/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Compute SHA256 for each asset
        id: shas
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl
          do
            asset="opencode-nanogpt-v${VERSION}-${target}.tar.gz"
            url="https://github.com/${REPO}/releases/download/${TAG}/${asset}"
            sha="$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)"
            echo "${target//-/_}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Rewrite formula
        working-directory: tap
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p Formula
          VERSION_NO_V="${TAG#v}"

          cat > Formula/opencode-nanogpt.rb <<EOF
          class OpencodeNanogpt < Formula
            desc "Command-line to integrate OpenCode with NanoGPT Provider"
            homepage "https://github.com/LunaticMuch/opencode-nanogpt"
            license "MIT"

            version "${VERSION_NO_V}"

            livecheck do
              url :stable
              strategy :github_latest
            end

            on_macos do
              on_arm do
                url "https://github.com/${{ github.repository }}/releases/download/${TAG}/opencode-nanogpt-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.shas.outputs.aarch64_apple_darwin }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/${{ github.repository }}/releases/download/${TAG}/opencode-nanogpt-v#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.shas.outputs.aarch64_unknown_linux_gnu }}"
              end
              on_intel do
                url "https://github.com/${{ github.repository }}/releases/download/${TAG}/opencode-nanogpt-v#{version}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${{ steps.shas.outputs.x86_64_unknown_linux_musl }}"
              end
            end

            def install
              bin.install "opencode-nanogpt"
            end

            test do
              assert_match "opencode-nanogpt", shell_output("#{bin}/opencode-nanogpt --version")
              assert_match "init", shell_output("#{bin}/opencode-nanogpt --help")
            end
          end
          EOF

      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/opencode-nanogpt.rb
          if git diff --staged --quiet; then
            echo "No formula change — already up to date."
            exit 0
          fi
          git commit -m "Bump opencode-nanogpt to ${{ steps.tag.outputs.tag }}"
          git push origin HEAD
